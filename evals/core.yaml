  required_answer_patterns:
  - (?is)(?:\biPhone\b(?:(?!\b(?:decreased?|declined?|fell|lower|down|not)\b)[^.!?]){0,100}\b(?:rose|risen|increased?|grew|grown|higher|up)\b|(?<!\bnot\s)(?<!\bno\s)(?<!\bnever\s)(?<!\bwithout\s)\b(?:higher|increased)\s+(?:\w+\s+){0,4}\biPhone\b)
  notes: The direction pattern checks a positive iPhone sales movement in the same sentence, accepting common paraphrases;
    it supplements lexical point matching and is not a general semantic-entailment judge.
